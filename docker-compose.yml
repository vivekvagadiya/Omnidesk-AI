services:
  # MongoDB — Primary Database (Users, Roles, Tickets, Assets)
  mongodb:
    image: mongo:7.0
    container_name: omnidesk-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - omnidesk-network

  # Redis (state) — chat sessions, HITL action tokens, rate limits, notification queue.
  # This data must never be silently evicted: noeviction + AOF persistence.
  redis:
    image: redis:7-alpine
    container_name: omnidesk-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-omnidesk_dev_redis}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-omnidesk_dev_redis}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6380:6379" # localhost only — not reachable from the LAN
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - omnidesk-network

  # Redis (cache) — HTTP response cache only. Safe to lose: evicts least-recently-used
  # keys when full and keeps nothing on disk.
  redis-cache:
    image: redis:7-alpine
    container_name: omnidesk-redis-cache
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-omnidesk_dev_redis}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-omnidesk_dev_redis}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - omnidesk-network

  # Qdrant — Vector Database for HR & IT Policies (RAG Engine)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: omnidesk-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - omnidesk-network

volumes:
  mongodb_data:
  redis_data:
  qdrant_data:

networks:
  omnidesk-network:
    driver: bridge
